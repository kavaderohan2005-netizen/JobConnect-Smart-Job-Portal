{% extends "base.html" %}

{% block title %}Page Not Found – JobConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="brand-icon mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.2rem; background: var(--gray-100); color: var(--danger);">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="display-3 fw-bold text-dark">404</h1>
    <h3 class="fw-bold text-secondary mb-3">Page Not Found</h3>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
      The page or job opening you are looking for may have expired, been removed, or the link might be mistyped.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 fw-bold">
        <i class="fa-solid fa-house me-1"></i> Return Home
      </a>
      <a href="{{ url_for('main.search') }}" class="btn btn-outline-secondary px-4 fw-bold">
        <i class="fa-solid fa-magnifying-glass me-1"></i> Search Jobs
      </a>
    </div>
  </div>
</div>
{% endblock %}
