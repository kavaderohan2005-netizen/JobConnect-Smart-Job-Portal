{% extends "base.html" %}

{% block title %}Server Error – JobConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="brand-icon mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2.2rem; background: var(--gray-100); color: var(--danger);">
      <i class="fa-solid fa-server"></i>
    </div>
    <h1 class="display-3 fw-bold text-dark">500</h1>
    <h3 class="fw-bold text-secondary mb-3">Internal Server Error</h3>
    <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
      An unexpected situation arose on the server. Our engineering team has been notified.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 fw-bold">
      <i class="fa-solid fa-house me-1"></i> Return Home
    </a>
  </div>
</div>
{% endblock %}
